name: Desktop Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Only run on version tags (e.g. v1.2.3, v2.0.0-beta.1) or manual trigger.
  # Do NOT run on every main push — macOS/Windows runners are expensive.
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-build:
    name: Build (${{ matrix.platform }} / ${{ matrix.arch_hint }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_id: linux
            arch_hint: amd64
          # Apple Silicon (M1/M2/M3)
          - platform: macos-latest
            os_id: macos
            arch_hint: arm64
          - platform: windows-latest
            os_id: windows
            arch_hint: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run tauri:build

      - name: Ad-hoc codesign macOS bundle (prevents "damaged" Gatekeeper error)
        if: matrix.os_id == 'macos'
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)"
          if [[ -n "$APP_PATH" ]]; then
            codesign --force --deep --sign - "$APP_PATH"
            echo "Signed: $APP_PATH"
          fi
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -maxdepth 1 | head -1)"
          if [[ -n "$DMG_PATH" ]]; then
            codesign --force --sign - "$DMG_PATH"
            echo "Signed: $DMG_PATH"
          fi

      - name: Resolve artifact metadata
        id: meta
        shell: bash
        run: |
          arch="${{ matrix.arch_hint }}"
          if [[ -z "$arch" ]]; then
            arch="${RUNNER_ARCH,,}"
          fi
          if [[ "$arch" == "x64" ]]; then
            arch="amd64"
          fi
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "artifact_name=DevToolbox-${{ matrix.os_id }}-$arch" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          OS_ID="${{ matrix.os_id }}"
          ARCH="${{ steps.meta.outputs.arch }}"
          found=0

          while IFS= read -r -d '' file; do
            found=1
            base_name="$(basename "$file")"

            # Derive the full compound extension after the first dot (e.g. "msi.zip.sig", "tar.gz")
            # This correctly handles *.msi.zip.sig and similar Tauri updater artifacts.
            ext="${base_name#*.}"

            dest="release-assets/DevToolbox-${OS_ID}-${ARCH}.${ext}"
            echo "Copying $file -> $dest"
            cp "$file" "$dest"
          done < <(find src-tauri/target/release/bundle -type f \( \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.sig" \
          \) -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "::error::No package files found in src-tauri/target/release/bundle"
            exit 1
          fi

          echo "--- release-assets contents ---"
          ls -lh release-assets/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-assets/**/*
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tauri-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Mark as pre-release if the version contains a pre-release identifier
          # e.g. v1.0.0-alpha.1, v2.0.0-beta.2, v1.5.0-rc.1
          if [[ "$VERSION" =~ -(alpha|beta|rc)\. ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DevToolbox v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          files: release-artifacts/**/*
          generate_release_notes: true
