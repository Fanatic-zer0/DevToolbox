name: Desktop Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_id: linux
            arch_hint: amd64
          - platform: macos-latest
            os_id: macos
            arch_hint: arm64
          - platform: windows-latest
            os_id: windows
            arch_hint: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run tauri:build

      - name: Resolve artifact metadata
        id: meta
        shell: bash
        run: |
          arch="${{ matrix.arch_hint }}"
          if [[ -z "$arch" ]]; then
            arch="${RUNNER_ARCH,,}"
          fi
          if [[ "$arch" == "x64" ]]; then
            arch="amd64"
          fi
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "artifact_name=DevToolbox-${{ matrix.os_id }}-$arch" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          OS_ID="${{ matrix.os_id }}"
          ARCH="${{ steps.meta.outputs.arch }}"
          found=0

          while IFS= read -r -d '' file; do
            found=1
            base_name="$(basename "$file")"

            case "$base_name" in
              *.sig)
                # Preserve the full extension chain (e.g. .msi.zip.sig) with DevToolbox- prefix
                ext="${base_name#*.}"
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.${ext}"
                ;;
              *.tar.gz)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.tar.gz"
                ;;
              *.AppImage)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.AppImage"
                ;;
              *.dmg)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.dmg"
                ;;
              *.msi)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.msi"
                ;;
              *.exe)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.exe"
                ;;
              *.deb)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.deb"
                ;;
              *.rpm)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.rpm"
                ;;
              *.zip)
                cp "$file" "release-assets/DevToolbox-${OS_ID}-${ARCH}.zip"
                ;;
            esac
          done < <(find src-tauri/target/release/bundle -type f \( \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.sig" \
          \) -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No package files found in bundle output"
            exit 1
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-assets/**/*
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tauri-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release version
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DevToolbox v${{ env.RELEASE_VERSION }}
          files: |
            release-artifacts/**/DevToolbox-*.dmg
            release-artifacts/**/DevToolbox-*.msi
            release-artifacts/**/DevToolbox-*.exe
            release-artifacts/**/DevToolbox-*.deb
            release-artifacts/**/DevToolbox-*.AppImage
            release-artifacts/**/DevToolbox-*.rpm
            release-artifacts/**/DevToolbox-*.tar.gz
            release-artifacts/**/DevToolbox-*.zip
            release-artifacts/**/DevToolbox-*.sig
          generate_release_notes: true
